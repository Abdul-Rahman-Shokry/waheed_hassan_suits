name: waheed_hassan_suits
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  lottie: ^3.3.3
  flutter_screenutil: ^5.9.3
  flutter_launcher_icons: ^0.14.4
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/svg/

  fonts:
     - family: IBMPlexSansArabic
       fonts:
         - asset: assets/fonts/IBMPlexSansArabic-Regular-w400.ttf
           weight: 400
         - asset: assets/fonts/IBMPlexSansArabic-Medium-w500.ttf
           weight: 500
         - asset: assets/fonts/IBMPlexSansArabic-SemiBold-w600.ttf
           weight: 600
         - asset: assets/fonts/IBMPlexSansArabic-Bold-w700.ttf
           weight: 700

  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    remove_alpha_ios: true
    image_path: "assets/images/logo.png"